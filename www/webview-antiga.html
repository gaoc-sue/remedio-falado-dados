<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualize o celular</title>
<style>
body{margin:0;background:#F3F5EF;color:#11211C;font-family:Verdana,sans-serif;font-size:19px;line-height:1.45;padding:32px 18px}
h1{font-size:1.5rem;margin:0 0 12px}
p{margin:0 0 14px}
ol{padding-left:22px;margin:0 0 16px}
li{margin-bottom:8px}
a{display:block;background:#0B6B5E;color:#fff;text-align:center;padding:18px;border-radius:14px;font-weight:bold;text-decoration:none;margin-top:8px}
.box{background:#fff;border:2px solid #CFD8CF;border-radius:16px;padding:18px}
</style>
</head>
<body>
<div class="box">
<h1>Falta uma atualização no celular</h1>
<p>O BULA precisa do <b>Android System WebView</b> atualizado. É um app do Google que já vem no celular.</p>
<ol>
<li>Abra a <b>Play Store</b>.</li>
<li>Procure <b>Android System WebView</b> (ou <b>Google Chrome</b>).</li>
<li>Toque em <b>Atualizar</b>.</li>
<li>Feche e abra o BULA de novo.</li>
</ol>
<a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Abrir na Play Store</a>
</div>
</body>
</html>
